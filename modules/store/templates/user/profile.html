{% load static %}
<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ t.customer_profile|default:"Hồ sơ khách hàng" }}</title>
  <link rel="stylesheet" href="{% static 'admin/css/style.css' %}">
</head>
<body data-theme="light">
  <main class="content" style="max-width:760px;margin:0 auto;padding:32px 18px;">
    {% if messages %}{% for message in messages %}<div class="msg">{{ message }}</div>{% endfor %}{% endif %}
    <section class="panel card">
      <h1 style="margin-top:0;">{{ t.customer_profile|default:"Hồ sơ khách hàng" }}</h1>
      <form method="post">
        {% csrf_token %}
        <div class="form-group"><label>{{ t.full_name|default:"Họ tên" }}</label><input type="text" name="full_name" value="{{ request.user.get_full_name }}"></div>
        <div class="form-group"><label>Email</label><input type="email" name="email" value="{{ request.user.email|default:'' }}"></div>
        <div class="form-group"><label>Số điện thoại</label><input type="text" name="phone" value="{{ profile.so_dien_thoai|default:'' }}"></div>
        <div class="form-group"><label>{{ t.delivery_address|default:"Địa chỉ giao hàng" }}</label><input type="text" name="address" value="{{ profile.dia_chi|default:'' }}"></div>
        <div style="display:flex;gap:12px;flex-wrap:wrap;">
          <button class="btn btn-primary" type="submit">{{ t.update_profile|default:"Cập nhật hồ sơ" }}</button>
          <a class="btn btn-light" href="{% url 'store:user_dashboard' %}">{{ t.cancel|default:"Hủy" }}</a>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
